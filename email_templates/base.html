<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{subject}}</title>
<style>
@font-face{font-family:simvoni;src:url({{base}}/email/Simvoni.ttf);font-weight:normal;}
@font-face{font-family:simvoni;src:url({{base}}/email/Simvoni-Bold.ttf);font-weight:bold;}
</style>
</head>
<body style="margin:0;padding:0;background:{{page_bg}};font-family:simvoni,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:{{text}};">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{page_bg}};">
<tr><td align="center" style="padding:36px 16px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
    <tr><td align="center" style="padding:0 0 24px 0;">
      <img src="{{wordmark}}" width="180" height="48" alt="Meower" style="display:block;border:0;outline:none;height:48px;width:180px;">
    </td></tr>
    <tr><td style="background:{{card_bg}};border:1px solid {{border}};border-radius:22px;padding:36px 36px 30px 36px;">
      <h1 style="margin:0 0 18px 0;font-size:26px;line-height:1.25;font-weight:700;color:{{text}};">{{heading}}</h1>
      <div style="font-size:16px;line-height:1.6;color:{{text}};">{{body}}</div>
      {{callout_row}}
      {{button_row}}
      <div style="margin-top:28px;padding-top:20px;border-top:1px solid {{border}};font-size:13px;line-height:1.55;color:{{muted}};">{{footer}}</div>
    </td></tr>
    <tr><td align="center" style="padding:20px 8px 0 8px;font-size:12px;line-height:1.5;color:{{muted}};">Sent by Meower. Replies to this address aren't read.</td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
